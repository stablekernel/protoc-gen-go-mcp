name: Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Run Tests
        run: go test -v ./...

  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Versions are pinned by the `tool` directives in go.mod (currently
      # protoc-gen-go v1.36.6 and protoc-gen-go-grpc v1.5.1).
      - name: Install protoc-gen-go and protoc-gen-go-grpc
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go google.golang.org/grpc/cmd/protoc-gen-go-grpc

      - name: Generate
        run: make generate

      - name: Fail if generated files are out of date
        run: |
          git diff --exit-code -- examples/gen || {
            echo "::error::examples/gen is out of date; run 'make generate' and commit the result."
            exit 1
          }

  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os: [ubuntu, macos, windows]
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache: true

      - name: Build
        shell: bash
        run: |
          GOOS=${{ matrix.os == 'ubuntu' && 'linux' || matrix.os == 'macos' && 'darwin' || 'windows' }} \
          GOARCH=${{ matrix.arch }} \
          go build -v -o protoc-gen-go-mcp${{ matrix.os == 'windows' && '.exe' || '' }} ./cmd/protoc-gen-go-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-go-mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: protoc-gen-go-mcp${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error